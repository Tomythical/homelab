apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      annotations:
        hermes-agent.nousresearch.com/github-token-secret-version: "2"
      labels:
        app: hermes-agent
    spec:
      serviceAccountName: hermes-agent
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
      initContainers:
      - name: init-setup
        image: busybox
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        command:
        - sh
        - -c
        - |
          chown -R 10000:10000 /opt/data
          chmod -R u+rwX,g+rwX /opt/data
          if [ ! -f /opt/data/config.yaml ]; then
            cp /tmp-config/config.yaml /opt/data/config.yaml
            chown 10000:10000 /opt/data/config.yaml
          fi
          touch /shared/.dockerenv
          touch /shared/.containerenv
        volumeMounts:
        - name: hermes-data
          mountPath: /opt/data
        - name: hermes-config
          mountPath: /tmp-config
        - name: container-hints
          mountPath: /shared
      - name: copy-agent-source
        image: nousresearch/hermes-agent:v2026.8.31
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        command:
        - sh
        - -c
        - |
          cp -a /opt/hermes/. /agent-source/
          chown -R 10000:10000 /agent-source
        volumeMounts:
        - name: agent-source
          mountPath: /agent-source
      containers:
      - name: gateway
        image: nousresearch/hermes-agent:v2026.8.31
        args:
        - gateway
        - run
        envFrom:
        - secretRef:
            name: hermes-secrets
        env:
        - name: HERMES_HOME
          value: "/opt/data"
        livenessProbe:
          exec:
            command:
            - pgrep
            - -f
            - gateway
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - pgrep
            - -f
            - gateway
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
        volumeMounts:
        - name: hermes-data
          mountPath: /opt/data
        - name: container-hints
          mountPath: /.dockerenv
          subPath: .dockerenv
        - name: container-hints
          mountPath: /run/.containerenv
          subPath: .containerenv
      - name: dashboard
        image: nousresearch/hermes-agent:v2026.8.31
        args:
        - dashboard
        - --host
        - "0.0.0.0"
        - --no-open
        envFrom:
        - secretRef:
            name: hermes-secrets
        env:
        - name: HERMES_HOME
          value: "/opt/data"
        ports:
        - containerPort: 9119
          name: dashboard
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: 9119
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 9119
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - name: hermes-data
          mountPath: /opt/data
        - name: container-hints
          mountPath: /.dockerenv
          subPath: .dockerenv
        - name: container-hints
          mountPath: /run/.containerenv
          subPath: .containerenv
      - name: webui
        image: ghcr.io/tomythical/hermes-webui-playwright:0.52.166-playwright.2
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        envFrom:
        - secretRef:
            name: hermes-secrets
        - secretRef:
            name: hermes-github
        env:
        - name: HERMES_HOME
          value: "/opt/data"
        - name: HERMES_CONFIG_PATH
          value: "/opt/data/config.yaml"
        - name: HERMES_WEBUI_AGENT_DIR
          value: "/opt/hermes"
        - name: HERMES_WEBUI_HOST
          value: "0.0.0.0"
        - name: HERMES_WEBUI_PORT
          value: "8787"
        - name: HERMES_WEBUI_STATE_DIR
          value: "/opt/data/webui"
        - name: HERMES_WEBUI_DEFAULT_WORKSPACE
          value: "/opt/data/home"
        - name: HERMES_WEBUI_SECURE
          value: "1"
        - name: HERMES_SKIP_CHMOD
          value: "1"
        - name: WANTED_UID
          value: "10000"
        - name: WANTED_GID
          value: "10000"
        ports:
        - containerPort: 8787
          name: webui
          protocol: TCP
        startupProbe:
          httpGet:
            path: /health
            port: 8787
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 90
        livenessProbe:
          httpGet:
            path: /health
            port: 8787
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8787
          periodSeconds: 10
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
        volumeMounts:
        - name: hermes-data
          mountPath: /opt/data
        - name: agent-source
          mountPath: /opt/hermes
      volumes:
      - name: hermes-data
        persistentVolumeClaim:
          claimName: hermes-data
      - name: hermes-config
        configMap:
          name: hermes-config
      - name: container-hints
        emptyDir: {}
      - name: agent-source
        emptyDir: {}
