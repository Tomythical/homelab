apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-github
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-auth-api
  target:
    name: hermes-github
    creationPolicy: Owner
  data:
    - secretKey: HERMES_GITHUB_TOKEN
      remoteRef:
        key: HERMES_GITHUB_TOKEN
