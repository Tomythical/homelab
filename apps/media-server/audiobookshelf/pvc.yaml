---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-audiobookshelf-config
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: "1Gi"
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-audiobookshelf-metadata
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: "5Gi"
  storageClassName: local-path
