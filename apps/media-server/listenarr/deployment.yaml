---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: listenarr
  labels:
    app: listenarr
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: listenarr
  template:
    metadata:
      labels:
        app: listenarr
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init-media-dirs
          image: docker.io/library/busybox:1.38.0
          command: ["sh", "-c", "mkdir -p /data/media/audiobooks"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "32Mi"
          volumeMounts:
            - name: mediaserver-volume
              mountPath: /data
      containers:
        - name: listenarr
          # Only canary releases are currently published upstream.
          # yamllint disable-line rule:line-length
          image: ghcr.io/listenarrs/listenarr:canary-1.5.10@sha256:5aa2cb52dec352861f521aea6bf0286a22f2505c29a1ef41a745f099fdafaf1a
          env:
            - name: UMASK
              value: "002"
          ports:
            - name: http
              containerPort: 4545
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/v1/system/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/v1/system/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: listenarr-config
              mountPath: /app/config
            - name: mediaserver-volume
              mountPath: /data
      volumes:
        - name: listenarr-config
          persistentVolumeClaim:
            claimName: pvc-listenarr-config
        - name: mediaserver-volume
          persistentVolumeClaim:
            claimName: mediaserver-rwo-pvc
