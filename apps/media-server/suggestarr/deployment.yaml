---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: suggestarr
  labels:
    app: suggestarr
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: suggestarr
  template:
    metadata:
      labels:
        app: suggestarr
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: suggestarr
          # yamllint disable-line rule:line-length
          image: ciuse99/suggestarr:v3.3.0@sha256:43effdc10ee4ba8c8b9279c34a60f4ef6c4962057309e6332b583fb8a271be48
          env:
            - name: SUGGESTARR_PORT
              value: "5000"
            - name: LOG_LEVEL
              value: "INFO"
            - name: SUGGESTARR_ALLOWED_ORIGINS
              value: "https://suggestarr.ratfish-company.ts.net"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          # The readiness endpoint requires TMDb configuration, blocking setup.
          readinessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: config
              mountPath: /app/config/config_files
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: pvc-suggestarr-config
        - name: tmp
          emptyDir:
            sizeLimit: "256Mi"
