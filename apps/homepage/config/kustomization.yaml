apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: "media-server"
configMapGenerator:
  - name: "bookmarks"
    files:
      - bookmarks.yaml
  - name: "custom-css"
    files:
      - custom.css
  - name: "kubernetes"
    files:
      - kubernetes.yaml
  - name: "services"
    files:
      - services.yaml
  - name: "settings"
    files:
      - settings.yaml
  - name: "widgets"
    files:
      - widgets.yaml
generatorOptions:
  labels:
    app.kubernetes.io/name: "homepage"
