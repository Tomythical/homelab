apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
  namespace: media-server
  labels:
    app.kubernetes.io/name: homepage
data:
  settings.yaml: |
    title: Homelab
    language: en
    theme: dark
    color: slate
    target: _self
    headerStyle: boxedWidgets
    statusStyle: "dot"
    hideVersion: true
    disableCollapse: true

    # Site Assets
    base: https://homepage.ratfish-company.ts.net
    background:
      image: https://images.unsplash.com/photo-1502790671504-542ad42d5189?auto=format&fit=crop&w=2560&q=80
      blur: sm
      saturate: 50
      brightness: 50
      opacity: 30

    # Layout Configuration
    layout:
      Start:
          style: row
          columns: 4
          tab: HOME
          icon: mdi-view-dashboard
      Media:
          style: row
          columns: 4
          tab: HOME
          icon: mdi-multimedia
      Downloads:
          style: row
          columns: 4
          tab: MEDIA
          icon: mdi-download
      Automation:
          style: row
          columns: 4
          tab: APPS
          icon: mdi-robot
      Messaging:
          style: row
          columns: 3
          tab: APPS
          icon: mdi-message-processing
      Observability:
          style: row
          columns: 4
          tab: OPS
          icon: mdi-monitor-dashboard
      Identity:
          style: row
          columns: 2
          tab: OPS
          icon: mdi-account-lock
      Internal:
          style: row
          columns: 4
          tab: OPS
          icon: mdi-kubernetes
          initiallyCollapsed: true
      Homepage Configuration:
          style: row
          columns: 2
          tab: OPS
          icon: mdi-home
