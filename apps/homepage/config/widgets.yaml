- greeting:
    text_size: "2xl"
    text: "Homelab"

- resources:
    label: "Server"
    expanded: false
    cpu: true
    memory: true
    disk: "/media"
    uptime: true
    refresh: 10000

- datetime:
    text_size: "lg"
    locale: "en-GB"
    format:
      dateStyle: "medium"
      timeStyle: "short"
      hour12: false

- search:
    provider: "google"
    focus: false
    showSearchSuggestions: false
    target: "_self"

- openmeteo:
    label: "London"
    latitude: 51.513437757683576
    longitude: 0.007144050584081777
    timezone: "Europe/London"
    units: "metric"
    cache: 15
    format:
      maximumFractionDigits: 0
