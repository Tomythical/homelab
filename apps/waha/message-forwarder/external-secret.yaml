apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "waha-forwarder-secrets"
spec:
  refreshInterval: "5m"
  secretStoreRef:
    kind: "ClusterSecretStore"
    name: "doppler-auth-api"
  target:
    name: "waha-forwarder-secrets"
    creationPolicy: "Owner"
    template:
      engineVersion: "v2"
      mergePolicy: "Merge"
      data:
        hook-url: "http://waha-forwarder.waha.svc.cluster.local/webhook"
  data:
    - secretKey: "hmac-key"
      remoteRef:
        key: "WAHA_FORWARDER_HMAC_KEY"
    - secretKey: "config.json"
      remoteRef:
        key: "WAHA_FORWARDER_CONFIG"
