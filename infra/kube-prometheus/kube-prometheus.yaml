apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 10m
  releaseName: kube-prometheus-stack
  targetNamespace: monitoring
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    # Talos keeps these metrics listeners on the host loopback interface.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    alertmanager:
      alertmanagerSpec:
        secrets:
          - handler-alertmanager-webhook
      config:
        route:
          receiver: "handler"
          group_by: ["namespace", "alertname", "instance"]
          group_wait: "30s"
          group_interval: "5m"
          repeat_interval: "12h"
          routes:
            - receiver: "null"
              matchers:
                - 'alertname = "Watchdog"'
        receivers:
          - name: "null"
          - name: "handler"
            webhook_configs:
              - url_file: "/etc/alertmanager/secrets/handler-alertmanager-webhook/url"
                send_resolved: true
    grafana:
      sidecar:
        dashboards:
          provider:
            allowUiUpdates: true
      admin:
        existingSecret: "grafana-admin"
        userKey: "admin-user"
        passwordKey: "admin-password"
      persistence:
        enabled: true
        type: sts
        storageClassName: "local-path"
        accessModes:
          - ReadWriteOnce
        size: 10Gi
      podSecurityContext:
        fsGroup: 472
      containerSecurityContext:
        runAsUser: 472
        runAsGroup: 472
      initChownData:
        enabled: false
    prometheus:
      prometheusSpec:
        retentionSize: "40GB"
        retention: "30d"
        securityContext:
            runAsUser: 0
            runAsNonRoot: false
            runAsGroup: 0
            fsGroup: 0
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: "local-path"
              resources:
                requests:
                  storage: 50Gi
