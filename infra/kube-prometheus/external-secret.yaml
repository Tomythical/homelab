apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: handler-alertmanager-webhook
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-auth-api
  target:
    name: handler-alertmanager-webhook
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: HANDLER_ALERTMANAGER_WEBHOOK_URL
