apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: handler-alertmanager-webhook
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-auth-api
  target:
    name: handler-alertmanager-webhook
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: HANDLER_ALERTMANAGER_WEBHOOK_URL
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-auth-api
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      data:
        admin-user: "tomythical"
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: GRAFANA_ADMIN_PASSWORD
