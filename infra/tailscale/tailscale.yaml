apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 1h
  chart:
    spec:
      chart: tailscale-operator
      sourceRef:
        kind: HelmRepository
        name: tailscale-repo
        namespace: flux-system
  values:
    installCRDs: false
    operatorConfig:
      podAnnotations:
        redeploy-at: "2026-11-08T00:56:37Z"
      defaultTags:
        - "tag:k8s-operator"
      image:
        repository: tailscale/k8s-operator
        tag: "v1.104.7"
      logging: "debug" # info, debug, dev
    apiServerProxyConfig:
      allowImpersonation: "true"
      mode: "true"
