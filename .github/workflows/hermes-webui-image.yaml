name: Build Hermes WebUI Playwright image

on:
  push:
    branches:
      - main
    paths:
      - "apps/hermes-agent/Dockerfile"
      - ".github/workflows/hermes-webui-image.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: apps/hermes-agent
          push: true
          tags: ghcr.io/tomythical/hermes-webui-playwright:0.52.166-playwright.1
          cache-from: type=gha
          cache-to: type=gha,mode=max
